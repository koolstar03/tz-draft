plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sahil.TzDraft'
    compileSdk 34

    defaultConfig {
        applicationId "com.sahil.TzDraft"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "1.3"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
